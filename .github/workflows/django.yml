name: Django CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      name: Django CI

      on:
        push:
          branches: [ main, master, egc_test ]
        pull_request:
          branches: [ main, master ]
        workflow_dispatch: {}

      jobs:
        tests:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Run migrations
              run: |
                python manage.py migrate --noinput
            - name: Run tests
              run: |
                pytest -q

        cobertura:
          needs: tests
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install deps + coverage
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt coverage
            - name: Run tests with coverage
              run: |
                coverage run -m pytest
                coverage xml -o coverage.xml
            - name: Upload coverage to Codacy
              if: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
              env:
                CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
              run: |
                bash <(curl -Ls https://coverage.codacy.com/get.sh) coverage.xml || echo "Codacy upload skipped"

        build:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: postgres:14.9
              env:
                POSTGRES_USER: decide
                POSTGRES_PASSWORD: decide
                POSTGRES_DB: decide
              ports:
                - 5432:5432
              options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          steps:
            - uses: actions/checkout@v3
            - name: Set up Python 3.11
              uses: actions/setup-python@v4
              with:
                python-version: 3.11
            - name: psycopg2 prerequisites
              run: sudo apt-get update && sudo apt-get install -y libpq-dev
            - name: Install dependencies and config
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install codacy-coverage
                cp decide/local_settings.gactions.py decide/local_settings.py
            - name: Run migrations
              run: |
                cd decide
                python manage.py migrate
            - name: Run tests with coverage
              run: |
                cd decide
                coverage run --branch --source=. ./manage.py test --keepdb
                coverage xml -o decide/coverage.xml
            - name: Codacy Coverage Reporter
              if: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
              uses: codacy/codacy-coverage-reporter-action@v1
              with:
                project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
                coverage-reports: decide/coverage.xml
